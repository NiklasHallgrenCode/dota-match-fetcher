name: Fetch and analyze matches

on:
  schedule:
    # Daily at 05:30 Stockholm time: 03:30 UTC in summer (CEST), 04:30 UTC in winter (CET)
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-matches
  cancel-in-progress: false

jobs:
  # GitHub schedules are in UTC. Each workflow has a summer and a winter time; only the one
  # matching Stockholm's current offset (CEST +0200 / CET +0100) goes ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Stockholm date +%z)
          if [ -z "$SCHEDULE" ] \
            || { [ "$SCHEDULE" = "30 3 * * *" ] && [ "$offset" = "+0200" ]; } \
            || { [ "$SCHEDULE" = "30 4 * * *" ] && [ "$offset" = "+0100" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: $SCHEDULE is not the Stockholm-time run today (offset $offset)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build replay extractor
        run: mvn -q -B -f extractor/pom.xml package

      - name: Fetch and analyze replays
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: python3 scripts/fetch_matches.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches/ state/
          if git diff --cached --quiet; then
            echo "No new matches"
          else
            git commit -m "Add $(git diff --cached --name-only -- matches/ | wc -l) matches"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
