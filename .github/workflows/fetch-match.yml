name: Fetch monthly matches

on:
  schedule:
    # 03:17 UTC on the 1st of every month: fetches the month that just ended
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to fetch as YYYY-MM (leave empty for last full month)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Fetch matches from OpenDota
        env:
          MONTH: ${{ inputs.month }}
        run: python3 scripts/fetch_month.py

      - name: Commit new matches
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches/
          if git diff --cached --quiet; then
            echo "No new matches"
          else
            git commit -m "Add $(git diff --cached --name-only | wc -l) matches"
            git push
          fi
