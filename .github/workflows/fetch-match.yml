name: Fetch and analyze matches

on:
  schedule:
    # Daily at 04:23 UTC: 05:23 Stockholm time in winter, 06:23 in summer. Off the hour and
    # half hour, when GitHub's scheduled runs are delayed the most.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build replay extractor
        run: mvn -q -B -f extractor/pom.xml package

      - name: Fetch and analyze replays
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: python3 scripts/fetch_matches.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches/ state/
          if git diff --cached --quiet; then
            echo "No new matches"
          else
            git commit -m "Add $(git diff --cached --name-only -- matches/ | wc -l) matches"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
