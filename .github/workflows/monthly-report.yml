name: Monthly lane report

on:
  schedule:
    # 12:00 Stockholm time on the 1st: 10:00 UTC in summer (CEST), 11:00 UTC in winter (CET)
    - cron: "0 10 1 * *"
    - cron: "0 11 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month as YYYY-MM (leave empty for last month)"
        required: false
        default: ""
      post:
        description: "Post to Discord"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fetch-matches
  cancel-in-progress: false

jobs:
  # GitHub schedules are in UTC. Each workflow has a summer and a winter time; only the one
  # matching Stockholm's current offset (CEST +0200 / CET +0100) goes ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Stockholm date +%z)
          if [ -z "$SCHEDULE" ] \
            || { [ "$SCHEDULE" = "0 10 1 * *" ] && [ "$offset" = "+0200" ]; } \
            || { [ "$SCHEDULE" = "0 11 1 * *" ] && [ "$offset" = "+0100" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: $SCHEDULE is not the Stockholm-time run today (offset $offset)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        # Uses the Google Chrome already installed on the runner, so no browser download
        run: |
          pip install playwright==1.49.1
          google-chrome --version

      - name: Build and post report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONTH: ${{ inputs.month }}
          # Scheduled runs have no inputs, so post unless explicitly turned off
          POST: ${{ github.event_name == 'schedule' || inputs.post }}
        run: |
          args=()
          [ -n "$MONTH" ] && args+=(--month "$MONTH")
          if [ "$POST" = "true" ]; then
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              args+=(--post)
            else
              echo "::warning::DISCORD_WEBHOOK_URL secret is not set; not posting"
            fi
          fi
          python3 scripts/monthly_report.py "${args[@]}"

      - name: Commit report image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Add lane report $(ls -t reports | head -1)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
