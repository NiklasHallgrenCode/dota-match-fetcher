name: Monthly lane report

on:
  schedule:
    # 11:48 UTC on the 1st: 12:48 Stockholm time in winter, 13:48 in summer
    - cron: "48 11 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month as YYYY-MM (leave empty for last month)"
        required: false
        default: ""
      post:
        description: "Post to Discord"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fetch-matches
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        # Uses the Google Chrome already installed on the runner, so no browser download
        run: |
          pip install playwright==1.49.1
          google-chrome --version

      - name: Build and post report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONTH: ${{ inputs.month }}
          # Scheduled runs have no inputs, so post unless explicitly turned off
          POST: ${{ github.event_name == 'schedule' || inputs.post }}
        run: |
          args=()
          [ -n "$MONTH" ] && args+=(--month "$MONTH")
          if [ "$POST" = "true" ]; then
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              args+=(--post)
            else
              echo "::warning::DISCORD_WEBHOOK_URL secret is not set; not posting"
            fi
          fi
          python3 scripts/monthly_report.py "${args[@]}"

      - name: Commit report image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "Add lane report $(ls -t reports | head -1)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
